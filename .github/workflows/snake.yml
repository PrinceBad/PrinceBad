name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate clean contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: PrinceBad
          outputs: |
            assets/contribution-signal.svg
            assets/contribution-signal-dark.svg?palette=github-dark
            assets/contribution-signal.gif

      - name: Commit updated contribution assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-signal*
          git diff --staged --quiet || git commit -m "chore(snake): auto-update contribution snake"
          git push origin main
