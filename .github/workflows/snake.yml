name: Generate Contribution Signal

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate dark hardware-style contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: PrinceBad
          outputs: |
            dist/contribution-signal.svg?color_snake=%2300E5FF&color_dots=%230D1117,%230B2A3D,%23075985,%230284C7,%2300D9FF
            dist/contribution-signal-dark.svg?palette=github-dark&color_snake=%2300E5FF&color_dots=%230D1117,%230B2A3D,%23075985,%230284C7,%2300D9FF
            dist/contribution-signal.gif?color_snake=%2300E5FF&color_dots=%230D1117,%230B2A3D,%23075985,%230284C7,%2300D9FF

      - name: Publish contribution signal
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
